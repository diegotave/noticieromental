<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Phonavi</title>
  <link rel="stylesheet" href="phonavicd.css">
  <link rel="stylesheet" href="mini-player.css">
</head>

<body>
  <div id="stage">

    <div class="logo-row" id="logoRow">
      <img
        class="phonavi-logo"
        src="IMAGES/REPRODUCTOR_PHONAVI/phonavi_logo_discoteca.png"
        alt="Phonavi"
      >
      <button class="theme-toggle" id="themeToggle" type="button" aria-label="Cambiar tema"></button>
    </div>

    <div id="previewArea">
      <div id="previewText">
        <span id="previewArtist"></span>
        <span id="previewTitle"></span>
      </div>
      <div id="previewCoverWrap">
        <img id="previewCover" src="" alt="">
        <img id="previewCaja" src="IMAGES/REPRODUCTOR_PHONAVI/CAJACDMINI.png" alt="">
      </div>
    </div>

    <div id="spineContainer">
      <div id="spineRail"></div>
    </div>

  </div>

  <script src="phonavicd.js"></script>
</body>
</html>
