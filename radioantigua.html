<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Radio Antigua</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@100;400;900&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #ffffff;
      --dial-size: 71.55%;
      --ring-color: #c92cff;
      --opacity-active: 1;
      --opacity-inactive: 0.30;
      --slot-transition: 560ms cubic-bezier(.22, .78, .18, 1);
      --bounce-down: 0.985;
      --bounce-up: 1.01;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: var(--bg);
      font-family: "Inter", Arial, Helvetica, sans-serif;
    }

    body {
      background: #fff;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }

    .stage {
      position: relative;
      width: 100vw;
      height: 100dvh;
      overflow: hidden;
      background: #fff;
    }

    .radio-button {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      border: none;
      background: transparent;
      padding: 0;
      margin: 0;
      cursor: pointer;
      display: block;
      transform-origin: center center;
    }

    .radio-button.bounce {
      animation: press 220ms ease;
    }

    @keyframes press {
      0% {
        transform: scale(1);
      }

      40% {
        transform: scale(var(--bounce-down));
      }

      70% {
        transform: scale(var(--bounce-up));
      }

      100% {
        transform: scale(1);
      }
    }

    .radio-video {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
      pointer-events: none;
      user-select: none;
      -webkit-user-drag: none;
      display: block;
      z-index: 5;
    }

    .dial-overlay {
      position: absolute;
      inset: 0;
      pointer-events: none;
      opacity: 0;
      transition: opacity 220ms ease;
      z-index: 1;
    }

    .dial-overlay.visible {
      opacity: 1;
    }

    .dial-area {
      position: absolute;
      left: 50%;
      top: 50%;
      width: var(--dial-size);
      height: var(--dial-size);
      transform: translate(-50%, -50%);
      pointer-events: none;
      overflow: visible;
    }

    .menu-layer {
      position: absolute;
      inset: 0;
      pointer-events: none;
      overflow: visible;
    }

    .ring-item {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 100%;
      height: 100%;
      transform-origin: center center;
      transition:
        transform var(--slot-transition),
        scale var(--slot-transition),
        filter var(--slot-transition);
      will-change: transform, opacity;
      pointer-events: none;
    }

    .ring-rotator {
      position: absolute;
      inset: 0;
      transform-origin: center center;
      pointer-events: none;
      will-change: transform;
    }

    .ring-item.hidden {
      opacity: 0;
    }

    .ring-svg {
      width: 100%;
      height: 100%;
      overflow: visible;
      display: block;
    }

    .ring-text {
      fill: var(--ring-color);
      font-family: "Inter";
      font-weight: 900;
      text-transform: uppercase;
      user-select: none;
      pointer-events: none;
      dominant-baseline: middle;
      text-rendering: geometricPrecision;
      text-anchor: middle;
    }

    .measure-svg {
      position: absolute;
      width: 0;
      height: 0;
      overflow: hidden;
      opacity: 0;
      pointer-events: none;
    }

    @media (max-aspect-ratio: 3/4) {
      :root {
        --dial-size: 93%;
      }

      .radio-video {
        object-fit: cover;
      }
    }
  </style>
</head>

<body>

  <div class="stage" id="stage">
    <button class="radio-button" id="radioBtn" aria-label="Activar radio antigua">
      <video id="radioVideo" class="radio-video" src="assets/VIDEOS/radioantigua/radioantigua_open.webm"
        poster="assets/IMAGES/radioantigua/radioantigua_armado/radioantigua_00.png" preload="auto" playsinline
        muted></video>
    </button>

    <div class="dial-overlay" id="dialOverlay" aria-hidden="true">
      <div class="dial-area" id="dialArea">
        <div class="menu-layer" id="menuLayer"></div>
      </div>
    </div>
  </div>

  <svg class="measure-svg" aria-hidden="true">
    <text id="measureText"></text>
  </svg>

  <script>
    const RADIO_VIDEO_PATH = "assets/VIDEOS/radioantigua/radioantigua_open.webm";
    const RADIO_POSTER_PATH = "assets/IMAGES/radioantigua/radioantigua_armado/radioantigua_00.png";
    const SEGMENT_GAP_DEG = 10;

    const radioBtn = document.getElementById("radioBtn");
    const radioVideo = document.getElementById("radioVideo");
    const dialOverlay = document.getElementById("dialOverlay");
    const menuLayer = document.getElementById("menuLayer");
    const stage = document.getElementById("stage");
    const measureTextEl = document.getElementById("measureText");

    let playing = false;
    let radioOpened = false;
    let hasUserGesture = false;

    radioVideo.src = RADIO_VIDEO_PATH;
    radioVideo.poster = RADIO_POSTER_PATH;
    radioVideo.currentTime = 0;

    async function playRadioSequence() {
      if (playing || radioOpened) return;

      playing = true;
      hasUserGesture = true;

      radioBtn.classList.remove("bounce");
      void radioBtn.offsetWidth;
      radioBtn.classList.add("bounce");

      try {
        radioVideo.currentTime = 0;
      } catch (e) { }

      try {
        await radioVideo.play();
      } catch (e) {
        playing = false;
      }
    }

    radioVideo.addEventListener("loadedmetadata", () => {
      try {
        radioVideo.currentTime = 0;
      } catch (e) { }
    });

    radioVideo.addEventListener("ended", () => {
      radioVideo.pause();
      playing = false;
      radioOpened = true;

      menuSystem.enabled = true;
      dialOverlay.classList.add("visible");
      dialOverlay.setAttribute("aria-hidden", "false");
      menuSystem.activateCurrentFeed();
    });

    radioBtn.addEventListener("click", playRadioSequence);

    const feeds = [
      {
        id: "techno",
        title: "FEED TECHNO",
        streamUrl: "",
        spinSpeed: 0.0105
      },
      {
        id: "peces",
        title: "FEED PECES",
        streamUrl: "",
        spinSpeed: -0.0088
      },
      {
        id: "lava",
        title: "FEED LAVA",
        streamUrl: "",
        spinSpeed: 0.0078
      },
      {
        id: "selva",
        title: "FEED SELVA",
        streamUrl: "",
        spinSpeed: -0.0094
      },
      {
        id: "cemento",
        title: "FEED CEMENTO",
        streamUrl: "",
        spinSpeed: 0.0084
      }
    ];

    const feedAudio = new Audio();
    feedAudio.crossOrigin = "anonymous";
    feedAudio.preload = "none";
    feedAudio.loop = false;

    function playFeed(index) {
      const feed = feeds[mod(index, feeds.length)];
      if (!feed || !feed.streamUrl) return;
      if (!hasUserGesture) return;

      if (feedAudio.src !== feed.streamUrl) {
        feedAudio.src = feed.streamUrl;
      }

      feedAudio.play().catch(() => { });
    }

    function mod(n, m) {
      return ((n % m) + m) % m;
    }

    function lerp(a, b, t) {
      return a + (b - a) * t;
    }

    function degToRad(deg) {
      return deg * Math.PI / 180;
    }

    function polarToCartesian(cx, cy, r, angleDeg) {
      const rad = degToRad(angleDeg);
      return {
        x: cx + r * Math.cos(rad),
        y: cy + r * Math.sin(rad)
      };
    }

    function arcPathD(cx, cy, r, startDeg, endDeg) {
      const start = polarToCartesian(cx, cy, r, startDeg);
      const end = polarToCartesian(cx, cy, r, endDeg);

      let delta = endDeg - startDeg;
      while (delta < 0) delta += 360;
      while (delta >= 360) delta -= 360;

      const largeArcFlag = delta > 180 ? 1 : 0;

      return `M ${start.x}, ${start.y} A ${r},${r} 0 ${largeArcFlag} 1 ${end.x}, ${end.y}`;
    }

    function buildSegmentString(title) {
      return ` ${title} `;
    }

    function measureTextWidth(text, fontSize, letterSpacing, fontWeight = 900) {
      measureTextEl.textContent = text;
      measureTextEl.setAttribute("font-size", fontSize);
      measureTextEl.setAttribute("letter-spacing", letterSpacing);
      measureTextEl.style.fontFamily = "Inter";
      measureTextEl.style.fontWeight = String(fontWeight);
      return measureTextEl.getComputedTextLength();
    }

    function getSegmentCount(radius, fontSize, letterSpacing, title) {
      const text = buildSegmentString(title);
      const textWidth = measureTextWidth(text, fontSize, letterSpacing, 900);

      const usableTwo = radius * degToRad(180 - SEGMENT_GAP_DEG);
      const usableThree = radius * degToRad(120 - SEGMENT_GAP_DEG);

      return textWidth <= usableThree ? 3 : 2;
    }

    function getSegmentAngles(segmentCount) {
      if (segmentCount === 3) {
        return [
          { start: -90 + SEGMENT_GAP_DEG / 2, end: 30 - SEGMENT_GAP_DEG / 2 },
          { start: 30 + SEGMENT_GAP_DEG / 2, end: 150 - SEGMENT_GAP_DEG / 2 },
          { start: 150 + SEGMENT_GAP_DEG / 2, end: 270 - SEGMENT_GAP_DEG / 2 }
        ];
      }

      return [
        { start: 180 + SEGMENT_GAP_DEG / 2, end: 360 - SEGMENT_GAP_DEG / 2 },
        { start: 0 + SEGMENT_GAP_DEG / 2, end: 180 - SEGMENT_GAP_DEG / 2 }
      ];
    }

    const SLOT_OUTER = {
      name: "outer",
      x: 0,
      y: 0,
      scale: 1.218,
      opacity: 0.30,
      radius: 360,
      fontSize: 92,
      letterSpacing: 5.4
    };

    const SLOT_ACTIVE = {
      name: "active",
      x: 0,
      y: 0,
      scale: 1.05,
      opacity: 1.00,
      radius: 333.3,
      fontSize: 88.4,
      letterSpacing: 6.2
    };

    const SLOT_INNER = {
      name: "inner",
      x: 0,
      y: 0,
      scale: 0.819,
      opacity: 0.30,
      radius: 310.8,
      fontSize: 124.8,
      letterSpacing: 3.2
    };

    class RingVisual {
      constructor(feed, feedIndex) {
        this.feed = feed;
        this.feedIndex = feedIndex;

        this.spinAngle = 0;
        this.targetSlot = null;

        this.displayX = 0;
        this.displayY = 0;
        this.displayScale = 1;
        this.displayOpacity = 0;
        this.displayRadius = 250;
        this.displayFontSize = 24;
        this.displayLetterSpacing = 2;

        this.targetX = 0;
        this.targetY = 0;
        this.targetScale = 1;
        this.targetOpacity = 0;
        this.targetRadius = 250;
        this.targetFontSize = 24;
        this.targetLetterSpacing = 2;

        this.el = document.createElement("div");
        this.el.className = "ring-item hidden";

        this.rotator = document.createElement("div");
        this.rotator.className = "ring-rotator";

        this.svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
        this.svg.setAttribute("class", "ring-svg");
        this.svg.setAttribute("viewBox", "0 0 1000 1000");
        this.svg.setAttribute("preserveAspectRatio", "xMidYMid meet");

        this.paths = [];
        this.texts = [];
        this.textPaths = [];

        for (let i = 0; i < 3; i++) {
          const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
          const pathId = `ringPath_${feed.id}_${feedIndex}_${i}`;
          path.setAttribute("id", pathId);
          path.setAttribute("fill", "none");

          const text = document.createElementNS("http://www.w3.org/2000/svg", "text");
          text.setAttribute("class", "ring-text");

          const textPath = document.createElementNS("http://www.w3.org/2000/svg", "textPath");
          textPath.setAttributeNS("http://www.w3.org/1999/xlink", "href", `#${pathId}`);
          textPath.setAttribute("startOffset", "50%");

          text.appendChild(textPath);

          this.paths.push(path);
          this.texts.push(text);
          this.textPaths.push(textPath);

          this.svg.appendChild(path);
          this.svg.appendChild(text);
        }

        this.rotator.appendChild(this.svg);
        this.el.appendChild(this.rotator);
        menuLayer.appendChild(this.el);
      }

      setTargetFromSlot(slot) {
        this.targetSlot = slot;
        this.targetX = slot.x;
        this.targetY = slot.y;
        this.targetScale = slot.scale;
        this.targetOpacity = slot.opacity;
        this.targetRadius = slot.radius;
        this.targetFontSize = slot.fontSize;
        this.targetLetterSpacing = slot.letterSpacing;
      }

      hide() {
        this.targetSlot = null;
        this.targetOpacity = 0;
      }

      snapToTarget() {
        this.displayX = this.targetX;
        this.displayY = this.targetY;
        this.displayScale = this.targetScale;
        this.displayOpacity = this.targetOpacity;
        this.displayRadius = this.targetRadius;
        this.displayFontSize = this.targetFontSize;
        this.displayLetterSpacing = this.targetLetterSpacing;
      }

      update(dt) {
        this.spinAngle += this.feed.spinSpeed * dt;

        this.displayX = lerp(this.displayX, this.targetX, 0.12);
        this.displayY = lerp(this.displayY, this.targetY, 0.12);
        this.displayScale = lerp(this.displayScale, this.targetScale, 0.12);
        this.displayRadius = lerp(this.displayRadius, this.targetRadius, 0.12);
        this.displayFontSize = lerp(this.displayFontSize, this.targetFontSize, 0.12);
        this.displayLetterSpacing = lerp(this.displayLetterSpacing, this.targetLetterSpacing, 0.12);

        const targetVisible = this.targetOpacity > 0.01;
        this.displayOpacity = this.targetOpacity;

        this.el.classList.toggle("hidden", !targetVisible);

        const cx = 500;
        const cy = 500;
        const textValue = buildSegmentString(this.feed.title);
        const segmentCount = getSegmentCount(
          this.displayRadius,
          this.displayFontSize,
          this.displayLetterSpacing,
          this.feed.title
        );
        const angles = getSegmentAngles(segmentCount);

        for (let i = 0; i < 3; i++) {
          const path = this.paths[i];
          const text = this.texts[i];
          const textPath = this.textPaths[i];

          if (i < segmentCount) {
            const seg = angles[i];
            path.setAttribute("d", arcPathD(cx, cy, this.displayRadius, seg.start, seg.end));
            path.style.display = "";
            text.style.display = "";

            text.setAttribute("font-size", this.displayFontSize.toFixed(2));
            text.setAttribute("letter-spacing", this.displayLetterSpacing.toFixed(2));
            text.setAttribute("text-anchor", "middle");
            text.style.fontFamily = "Inter";
            text.style.fontWeight = "900";

            textPath.textContent = textValue;
          } else {
            path.style.display = "none";
            text.style.display = "none";
            textPath.textContent = "";
          }
        }

        this.el.style.opacity = this.displayOpacity.toFixed(4);
        this.el.style.transform = `
          translate(-50%, -50%)
          translate(${this.displayX}px, ${this.displayY}px)
          scale(${this.displayScale})
        `;

        const rotDeg = this.spinAngle * 180 / Math.PI;
        this.rotator.style.transform = `rotate(${rotDeg}deg)`;
      }
    }

    const menuSystem = {
      enabled: false,
      activeIndex: 0,
      visuals: [],
      lastTime: performance.now(),
      lastPointerX: null,
      moveAccumulator: 0,
      moveThreshold: 70,
      transitionLock: false,
      transitionUnlockAt: 0,

      init() {
        this.visuals = feeds.map((feed, i) => new RingVisual(feed, i));
        this.rebuildTargets(true);
        requestAnimationFrame(this.loop.bind(this));

        stage.addEventListener("mousemove", this.onMouseMove.bind(this), { passive: true });
        stage.addEventListener("mouseleave", this.onMouseLeave.bind(this), { passive: true });

        stage.addEventListener("touchstart", (e) => {
          if (e.touches[0]) {
            this.lastPointerX = e.touches[0].clientX;
          }
        }, { passive: true });

        stage.addEventListener("touchmove", (e) => {
          if (e.touches[0]) {
            this.handlePointerDelta(e.touches[0].clientX);
          }
        }, { passive: true });
      },

      activateCurrentFeed() {
        playFeed(this.activeIndex);
      },

      onMouseLeave() {
        this.lastPointerX = null;
        this.moveAccumulator = 0;
      },

      onMouseMove(e) {
        this.handlePointerDelta(e.clientX);
      },

      handlePointerDelta(x) {
        if (!this.enabled) return;

        const now = performance.now();
        if (this.transitionLock && now < this.transitionUnlockAt) return;

        if (this.lastPointerX == null) {
          this.lastPointerX = x;
          return;
        }

        const dx = x - this.lastPointerX;
        this.lastPointerX = x;

        if (Math.abs(dx) < 0.5) return;

        this.moveAccumulator += dx;

        if (this.moveAccumulator >= this.moveThreshold) {
          this.moveAccumulator = 0;
          this.shiftRight();
        } else if (this.moveAccumulator <= -this.moveThreshold) {
          this.moveAccumulator = 0;
          this.shiftLeft();
        }
      },

      shiftRight() {
        this.activeIndex = mod(this.activeIndex - 1, feeds.length);
        this.lockTransition();
        this.rebuildTargets(false);
        this.activateCurrentFeed();
      },

      shiftLeft() {
        this.activeIndex = mod(this.activeIndex + 1, feeds.length);
        this.lockTransition();
        this.rebuildTargets(false);
        this.activateCurrentFeed();
      },

      lockTransition() {
        this.transitionLock = true;
        this.transitionUnlockAt = performance.now() + 430;
        setTimeout(() => {
          this.transitionLock = false;
        }, 430);
      },

      rebuildTargets(initialSnap = false) {
        const active = this.activeIndex;
        const outer = mod(active - 1, feeds.length);
        const inner = mod(active + 1, feeds.length);

        this.visuals.forEach((visual, i) => {
          if (i === outer) {
            visual.setTargetFromSlot(SLOT_OUTER);
          } else if (i === active) {
            visual.setTargetFromSlot(SLOT_ACTIVE);
          } else if (i === inner) {
            visual.setTargetFromSlot(SLOT_INNER);
          } else {
            visual.hide();
          }

          if (initialSnap) {
            visual.snapToTarget();
          }
        });
      },

      loop(now) {
        const dt = Math.min(2.0, (now - this.lastTime) / 16.6667);
        this.lastTime = now;

        this.visuals.forEach(v => v.update(dt));
        requestAnimationFrame(this.loop.bind(this));
      }
    };

    menuSystem.init();
  </script>
</body>

</html>
